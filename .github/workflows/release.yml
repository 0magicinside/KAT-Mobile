# Build the release APK and attach it to a GitHub release.
#
# Runs when a release is published, or by hand for an existing tag:
#   gh workflow run release.yml -f tag=v0.8.0
#
# The APK is debug-signed until KAT Mobile has a release key: the DEBUG_KEYSTORE_BASE64 secret
# holds one fixed debug keystore (alias androiddebugkey, password android), so that releases can
# update each other. The workflow refuses to run without it rather than sign with a throwaway key,
# and checks that the APK's signer is that keystore's certificate, KEY_SHA256.
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.8.0)
        required: true

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  KEY_SHA256: 4c2bd5530ca2a00c3039769fd19992c5344f95861c7321494deea89d824d6e00

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK and Rust
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: Install the signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"

      # AGP's injected signing properties (what Android Studio's "Generate Signed APK" passes) sign
      # with that keystore. A debug.keystore in ~/.android is not enough: on the runner, AGP
      # signed with a debug key of its own.
      - name: Build
        run: >-
          ./gradlew --no-daemon -PkatAbis=arm64-v8a
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/debug.keystore"
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=androiddebugkey
          -Pandroid.injected.signing.key.password=android
          assembleRelease

      - name: Check the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk"
          # "Signer #1 certificate SHA-256 digest: …" or, from newer build-tools, one line per
          # signature scheme ("V2 Signer: certificate SHA-256 digest: …"): all must be the same.
          signer=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          keystore=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signer: $signer"
          echo "Keystore:   $keystore"
          if [ -z "$signer" ] || [ "$signer" != "$keystore" ] || [ "$signer" != "$KEY_SHA256" ]; then
            echo "::error::The APK is not signed with the release keystore ($KEY_SHA256)"
            exit 1
          fi
          "$tools/zipalign" -c -P 16 4 "$apk"
          badging=$("$tools/aapt2" dump badging "$apk")
          echo "$badging" | head -1
          echo "$badging" | grep -q "versionName='${TAG#v}'" || { echo "::error::versionName is not ${TAG#v}"; exit 1; }
          if echo "$badging" | grep -q "uses-permission: name='android.permission.INTERNET'"; then
            echo "::error::The APK asks for the internet permission"
            exit 1
          fi
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libkat_rx.so' || { echo "::error::The native core is missing"; exit 1; }

      - name: Attach it to the release
        run: |
          name="KAT-Mobile-${TAG#v}.apk"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          gh release upload "$TAG" dist/* --clobber
